[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = []

# Ignore unused imports in __init__.py files - these are Odoo model registration patterns
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["academy_management"]

[tool.black]
line-length = 88
target-version = ['py310']
extend-exclude = '''
/(
  # Exclude Odoo manifest files
  __manifest__\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "odoo.*"
ignore_missing_imports = true
