name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install ruff black isort mypy pre-commit

      - name: Run linting
        run: |
          ruff check .
          black --check .
          isort --check .
          mypy .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Run Odoo tests via Docker Compose
        run: |
          # Start services
          docker compose up -d db
          sleep 10

          # Create test database
          docker compose exec -T db psql -U odoo -d postgres -c "DROP DATABASE IF EXISTS odoo_test;"
          docker compose exec -T db psql -U odoo -d postgres -c "CREATE DATABASE odoo_test OWNER odoo;"

          # Run tests
          docker compose up -d odoo
          sleep 15
          docker compose exec -T odoo odoo -d odoo_test --test-enable --stop-after-init \
            --init=academy_management --http-port=8099

          # Check results
          if docker compose exec -T odoo odoo -d odoo_test --test-enable --stop-after-init \
            --init=academy_management --http-port=8099 2>&1 | grep -q "0 failed, 0 error"; then
            echo "All tests passed!"
          else
            echo "Tests failed!"
            exit 1
          fi
