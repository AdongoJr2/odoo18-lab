name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install ruff black isort mypy pre-commit
          pip install odoo==18.0

      - name: Run linting
        run: |
          ruff check .
          black --check .
          isort --check .
          mypy .

      - name: Run Odoo tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          odoo -d odoo --test-enable --stop-after-init --init=academy_management --http-port=8070 || true
          # Check test results
          grep -E "tests.*passed|tests.*failed|error" /tmp/odoo.log 2>/dev/null || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install ruff black isort mypy pre-commit

      - name: Run linting
        run: |
          ruff check .
          black --check .
          isort --check .
          mypy .
